{% if page_obj.paginator.num_pages > 1 %}
  <nav class="pagination" aria-label="Pagination">
    {% if page_obj.has_previous %}
      <a class="page-link" href="?page={{ page_obj.previous_page_number }}{% if query_suffix %}&amp;{{ query_suffix }}{% endif %}" aria-label="Previous page">&larr; Prev</a>
    {% else %}
      <span class="page-link is-disabled">&larr; Prev</span>
    {% endif %}

    <span class="page-status">Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>

    {% if page_obj.has_next %}
      <a class="page-link" href="?page={{ page_obj.next_page_number }}{% if query_suffix %}&amp;{{ query_suffix }}{% endif %}" aria-label="Next page">Next &rarr;</a>
    {% else %}
      <span class="page-link is-disabled">Next &rarr;</span>
    {% endif %}
  </nav>
{% endif %}
